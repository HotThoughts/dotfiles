# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # Zed accepts JSON-with-comments/trailing-commas in these files.
        exclude: "(^|/)devcontainer\\.json$|^dot_config/zed/(keymap|tasks|private_settings)\\.json(\\.tmpl)?$"
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: 🔍 Check git leaks

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
        # -x is required in addition to the hook's default SC1091 exclusion so the
        # tests' '# shellcheck source=tests/lib.sh' directives are followed.
        args: [-e, SC1091, -x]
      - id: shfmt

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        files: \.(md|mdown|markdown)$

  # Source code spell checker
  - repo: https://github.com/crate-ci/typos
    rev: v1.41.0
    hooks:
      - id: typos

  # Lua formatter for Neovim config files
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.3.1
    hooks:
      - id: stylua
        files: \.lua$

  - repo: https://github.com/lycheeverse/lychee.git
    rev: v0.15.1
    hooks:
      - id: lychee
        # args replace the hook manifest's default '--no-progress'.
        # .lycheeignore is read automatically; '--exclude-file' is deprecated.
        args: [--no-progress, --max-retries, "3", --timeout, "30"]
        # The exclusion patterns are not links; never lint the ignore file itself.
        exclude: ^\.lycheeignore$
